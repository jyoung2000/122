services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: clipai-app
    restart: unless-stopped
    ports:
      - "1353:1353"
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/outputs:/data/outputs
      - ./data/logs:/data/logs
      - ./data/fonts:/data/fonts
      - whisper_models:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    # Enable GPU passthrough when NVIDIA Container Toolkit is installed.
    # If no GPU is available, the container still starts normally on CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute]
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1353/api/jobs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: clipai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      # Force Ollama to use all available GPU layers
      - OLLAMA_GPU_LAYERS=-1
      # Set VRAM budget to leave headroom (GTX 1650 = 4GB, reserve 512MB for system)
      - OLLAMA_MAX_VRAM=3758096384
      # Enable flash attention for memory efficiency
      - OLLAMA_FLASH_ATTENTION=1
      # Reduce KV cache to fit in VRAM
      - OLLAMA_KV_CACHE_TYPE=q8_0
    # Enable GPU passthrough so Ollama can use NVIDIA GPUs for inference.
    # Without this, models run on CPU (~30x slower for vision).
    # If no GPU is available, the container still starts normally on CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute]
    # Add CPU quota to fix the cgroup parsing warning
    cpus: '4.0'
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


volumes:
  ollama_models:
  whisper_models:
